<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rainbow Circuit</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #07080d;
      color: #f8f9fa;
      font-family: system-ui, sans-serif;
    }
    main {
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }
    p { color: #adb5bd; max-width: 28rem; }
  </style>
</head>
<body>
  <main>
    <h1>Rainbow Circuit</h1>
    <p>
      Host is up. Launch from the <strong>#rainbow-circuit</strong> text channel
      and stay in whatever voice call you already have. When you are done, use
      the red hand on this panel to stop the race — that does not disconnect you
      from voice.
    </p>
  </main>
</body>
</html>
