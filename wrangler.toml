name = "whatispugdoing"
main = "src/worker.js"
compatibility_date = "2026-08-03"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# Public Discord application id (not the client secret).
[vars]
DISCORD_CLIENT_ID = "1539068321310310531"

# Cloudflare will create DNS + certificates for these hostnames on deploy
[[routes]]
pattern = "whatispugdoing.com"
custom_domain = true

[[routes]]
pattern = "www.whatispugdoing.com"
custom_domain = true

[[routes]]
pattern = "circuit.whatispugdoing.com"
custom_domain = true
